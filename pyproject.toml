[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprintandchill"
version = "0.1.0"
description = "Framework scaffold for BlueprintAndChill, an Azure Landing Zone and subscription-vending accelerator."
readme = { text = "BlueprintAndChill foundational framework package.", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "See LICENSE file" }
authors = [
    { name = "Sleepyreaper" }
]
keywords = [
    "azure",
    "landing-zone",
    "alz",
    "caf",
    "subscription-vending",
    "platform-engineering",
    "iac"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration"
]
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.8,<3.0",
    "rich>=13.7,<14.0"
]

[project.optional-dependencies]
dev = [
    "black>=24.8,<25.0",
    "mypy>=1.11,<2.0",
    "ruff>=0.6,<1.0",
    "types-setuptools>=75.0.0.20240822"
]
test = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0"
]
runtime = [
    "python-dotenv>=1.0,<2.0"
]

[project.scripts]
blueprintandchill = "blueprintandchill.cli.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["blueprintandchill", "blueprintandchill.*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "W"
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
packages = ["blueprintandchill"]
mypy_path = "src"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=blueprintandchill",
    "--cov-report=term-missing"
]